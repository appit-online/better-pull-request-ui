
<nav class="t-header">
  <div class="t-header-brand-wrapper">
    <a href="index.html">
      <span class="brand-name">Review Hub</span>
    </a>
  </div>
</nav>
<div class="page-body">
  <aside class="sidebar">
    <div class="sidebar-user">
      <div class="sidebar-avatar">
        <div class="avatar-initials rounded-circle">
          {{ (userData?.login || userData?.name || '?').charAt(0).toUpperCase() }}
        </div>
        <img *ngIf="userData?.avatar_url" [src]="userData?.avatar_url"
          class="rounded-circle sidebar-avatar-img" alt=""
          (error)="asImg($event.target).style.display='none'">
      </div>
      <div class="sidebar-user-info">
        <span class="sidebar-username">{{ userData?.login || userData?.name || 'User' }}</span>
      </div>
    </div>

    <div class="sidebar-nav-section">Navigation</div>
    <ul class="sidebar-nav">
      <li>
        <a routerLink="/home" routerLinkActive="active" class="sidebar-nav-link">
          <i class="mdi mdi-view-dashboard sidebar-nav-icon"></i>
          <span>Dashboard</span>
        </a>
      </li>
      <li>
        <a routerLink="/settings" routerLinkActive="active" class="sidebar-nav-link">
          <i class="mdi mdi-settings sidebar-nav-icon"></i>
          <span>Settings</span>
        </a>
      </li>
    </ul>
  </aside>

  <div class="page-content-wrapper">
    <div class="page-content-wrapper-inner">
      <div class="content-viewport">
        <router-outlet></router-outlet>
      </div>
    </div>
    <footer class="footer">
      <small class="text-muted">© {{ dateYear }} App-IT</small>
    </footer>
  </div>
</div>
